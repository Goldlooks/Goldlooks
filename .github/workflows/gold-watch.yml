name: gold-watch

on:
  schedule:
    - cron: "*/10 * * * 0-5"   # toutes les 10 min, dimanche a vendredi (UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "test | all | sources | liquidity | briefing | weekly | open-asia | end-asia | open-london | end-london | open-ny | end-ny"
        default: "test"

permissions:
  contents: write

concurrency:
  group: gold-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Executer
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py "${{ github.event.inputs.mode || 'alert' }}"
      - name: Sauvegarder l'etat
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'alert' }}
        run: |
          git config user.name "gold-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
